<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>테크노트</title>
  <meta name="description" content="AI 에이전트 하네스 엔지니어링, 에이전트 설정(스킬 · MCP · AGENTS.md), 에이전트 장시간 · 무인 운영에 대한 기술 노트">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>


  <header class="mast">
    <p class="eyebrow">TECHNOTE</p>
    <h1>테크노트</h1>
    <div class="lede"><p>AI 에이전트를 움직이는 하네스와 그 주변 기술을 조사하고 정리합니다. 하네스의 구조와 동향, 스킬 · MCP · AGENTS.md 같은 에이전트 설정, 에이전트를 장시간 · 무인으로 일하게 하는 방법을 다룹니다.</p></div>
  </header>

  <main class="wrap">
    <div class="filters" role="group" aria-label="테마로 거르기">
      <button type="button" class="chip is-on" data-filter="all">전체 <span>1</span></button>
        <button type="button" class="chip" data-filter="harness-engineering">하네스 엔지니어링 <span>1</span></button>
        <button type="button" class="chip" data-filter="agent-config" disabled>스킬 · MCP · 에이전트 설정 <span>0</span></button>
        <button type="button" class="chip" data-filter="ai-night-shift" disabled>AI 야근시키기 <span>0</span></button>
    </div>

    <ol class="index">
      <li data-theme="harness-engineering">
        <a href="notes/harness-engineering/2026-10-12-harness-trends/">
          <span class="no">00</span>
          <span class="nm">하네스 8대 동향 (2026년 10월 12일 기준)</span>
          <span class="th">하네스 엔지니어링</span>
          <span class="dt">2026-10-12</span>
        </a>
      </li>
    </ol>
  </main>



<script src="assets/site.js"></script>
<script type="module">
  if (document.querySelector('.mermaid')) {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs');
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral', fontFamily: 'Pretendard Variable, sans-serif' });
    const els = [...document.querySelectorAll('.mermaid')];
    for (let i = 0; i < els.length; i++) {
      try {
        const { svg } = await mermaid.render('mmd-' + i, els[i].textContent);
        els[i].innerHTML = svg;
      } catch (e) { els[i].classList.add('mermaid-error'); }
      els[i].setAttribute('data-processed', 'true');
    }
  }
</script>
</body>
</html>
