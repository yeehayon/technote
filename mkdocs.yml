site_name: 테크노트
site_url: https://yeehayon.github.io/technote/
site_description: AI 에이전트 하네스 엔지니어링, 에이전트 설정(스킬 · MCP · AGENTS.md), 에이전트 장시간 · 무인 운영에 대한 기술 노트
repo_url: https://github.com/yeehayon/technote
docs_dir: docs
use_directory_urls: true

# 직접 만든 테마 (theme/main.html, theme/assets/)
theme:
  name: null
  custom_dir: theme

plugins: []   # 검색 등 기본 플러그인 끔

# 테마(분류) 목록: 폴더 이름 → 화면에 보이는 이름
extra:
  themes:
    harness-engineering: 하네스 엔지니어링
    agent-config: 스킬 · MCP · 에이전트 설정
    ai-night-shift: AI 야근시키기

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
      toc_depth: 2-3
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
